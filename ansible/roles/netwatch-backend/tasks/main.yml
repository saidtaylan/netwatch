---
# ──────────────────────────────────────────────────────────────────────────────
# Role: netwatch-backend — tasks/main.yml
# ──────────────────────────────────────────────────────────────────────────────

- name: Create netwatch system group
  ansible.builtin.group:
    name: "{{ netwatch_group }}"
    system: true
    state: present

- name: Create netwatch system user
  ansible.builtin.user:
    name: "{{ netwatch_user }}"
    group: "{{ netwatch_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create netwatch config directory
  ansible.builtin.file:
    path: "{{ netwatch_config_dir }}"
    state: directory
    owner: "{{ netwatch_user }}"
    group: "{{ netwatch_group }}"
    mode: "0750"

- name: Create netwatch state directory
  ansible.builtin.file:
    path: "{{ netwatch_state_dir }}"
    state: directory
    owner: "{{ netwatch_user }}"
    group: "{{ netwatch_group }}"
    mode: "0750"

# Map the host CPU arch to the release asset suffix.
- name: Resolve target architecture
  ansible.builtin.set_fact:
    netwatch_arch: "{{ {'x86_64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_architecture] | default('amd64') }}"

- name: Compute release download base URL
  ansible.builtin.set_fact:
    netwatch_dl_base: >-
      {{ ('https://github.com/' + netwatch_repo_slug + '/releases/latest/download')
         if netwatch_version == 'latest'
         else ('https://github.com/' + netwatch_repo_slug + '/releases/download/' + netwatch_version) }}

# Default: download the prebuilt binary from the GitHub Releases page.
- name: Download netwatch binary (release)
  ansible.builtin.get_url:
    url: "{{ netwatch_dl_base }}/netwatch-linux-{{ netwatch_arch }}"
    dest: "{{ netwatch_binary_dest }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart netwatch-backend
  when: netwatch_install_from == "release"

# Alternative: use a locally built binary from ansible/files/netwatch.
- name: Copy netwatch binary (local build)
  ansible.builtin.copy:
    src: "{{ netwatch_binary_src }}"
    dest: "{{ netwatch_binary_dest }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart netwatch-backend
  when: netwatch_install_from == "local"

- name: Template netwatch config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ netwatch_config_dir }}/config.yaml"
    owner: "{{ netwatch_user }}"
    group: "{{ netwatch_group }}"
    mode: "0640"
  notify: restart netwatch-backend

- name: Template netwatch-backend systemd unit
  ansible.builtin.template:
    src: netwatch-backend.service.j2
    dest: /etc/systemd/system/netwatch-backend.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart netwatch-backend

- name: Enable and start netwatch-backend service
  ansible.builtin.systemd:
    name: netwatch-backend
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for netwatch-backend health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ netwatch_http_port }}/health"
    method: GET
    status_code: 200
  register: health_check
  retries: 10
  delay: 3
  until: health_check.status == 200
