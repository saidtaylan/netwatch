---
# ──────────────────────────────────────────────────────────────────────────────
# Role: netwatch-backend — handlers/main.yml
# ──────────────────────────────────────────────────────────────────────────────

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart netwatch-backend
  ansible.builtin.systemd:
    name: netwatch-backend
    state: restarted
