---
# ──────────────────────────────────────────────────────────────────────────────
# Role: netwatch-frontend — tasks/main.yml
# Serves the pre-built Nuxt SPA via nginx (no Node.js runtime required).
# ──────────────────────────────────────────────────────────────────────────────

- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Create frontend static files directory
  ansible.builtin.file:
    path: "{{ netwatch_frontend_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Sync frontend static files
  ansible.posix.synchronize:
    src: "{{ netwatch_frontend_src }}"
    dest: "{{ netwatch_frontend_dir }}/"
    delete: true
    recursive: true
    checksum: true
  notify: reload nginx

- name: Template nginx site config (Debian/Ubuntu)
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/netwatch
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx
  when: ansible_os_family == "Debian"

- name: Template nginx config (RedHat/CentOS)
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/netwatch.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx
  when: ansible_os_family == "RedHat"

- name: Enable netwatch nginx site (Debian/Ubuntu)
  ansible.builtin.file:
    src: /etc/nginx/sites-available/netwatch
    dest: /etc/nginx/sites-enabled/netwatch
    state: link
  notify: reload nginx
  when: ansible_os_family == "Debian"

- name: Remove default nginx site (Debian/Ubuntu)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx
  when: ansible_os_family == "Debian"

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true
