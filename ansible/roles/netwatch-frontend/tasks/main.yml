---
# ──────────────────────────────────────────────────────────────────────────────
# Role: netwatch-frontend — tasks/main.yml
# Serves the pre-built Nuxt SPA via nginx (no Node.js runtime required).
# ──────────────────────────────────────────────────────────────────────────────

- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Create frontend static files directory
  ansible.builtin.file:
    path: "{{ netwatch_frontend_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Compute release download base URL
  ansible.builtin.set_fact:
    netwatch_dl_base: >-
      {{ ('https://github.com/' + netwatch_repo_slug + '/releases/latest/download')
         if netwatch_version == 'latest'
         else ('https://github.com/' + netwatch_repo_slug + '/releases/download/' + netwatch_version) }}

# Default: download the prebuilt static bundle from the GitHub Releases page and
# unpack it (remote_src) — no rsync, no Node.js, no build on the target.
- name: Download + unpack frontend bundle (release)
  ansible.builtin.unarchive:
    src: "{{ netwatch_dl_base }}/netwatch-frontend.tar.gz"
    dest: "{{ netwatch_frontend_dir }}/"
    remote_src: true
    owner: www-data
    group: www-data
  notify: reload nginx
  when: netwatch_install_from == "release"

# Alternative: copy a locally built bundle from ansible/files/frontend/.
- name: Copy frontend static files (local build)
  ansible.builtin.copy:
    src: "{{ netwatch_frontend_src }}"
    dest: "{{ netwatch_frontend_dir }}/"
    owner: www-data
    group: www-data
    mode: "0644"
    directory_mode: "0755"
  notify: reload nginx
  when: netwatch_install_from == "local"

- name: Template nginx site config (Debian/Ubuntu)
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/netwatch
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx
  when: ansible_os_family == "Debian"

- name: Template nginx config (RedHat/CentOS)
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/netwatch.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx
  when: ansible_os_family == "RedHat"

- name: Enable netwatch nginx site (Debian/Ubuntu)
  ansible.builtin.file:
    src: /etc/nginx/sites-available/netwatch
    dest: /etc/nginx/sites-enabled/netwatch
    state: link
  notify: reload nginx
  when: ansible_os_family == "Debian"

- name: Remove default nginx site (Debian/Ubuntu)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx
  when: ansible_os_family == "Debian"

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true
