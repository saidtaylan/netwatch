---
# ──────────────────────────────────────────────────────────────────────────────
# netwatch — global variables (applies to all hosts)
# ──────────────────────────────────────────────────────────────────────────────

# ── Install source ────────────────────────────────────────────────────────────
# "release" (default) downloads prebuilt artifacts from the GitHub Releases page —
# nothing is compiled on the target hosts. "local" uses files you place under
# ansible/files/ yourself (build them first).
netwatch_install_from: "release"           # release | local
netwatch_repo_slug: "saidtaylan/netwatch"
netwatch_version: "latest"                  # "latest" or a tag like "v0.1.3"

# ── Binary (backend) ──────────────────────────────────────────────────────────
netwatch_binary_dest: "/usr/local/bin/netwatch"
# Used only when netwatch_install_from == "local":
netwatch_binary_src: "{{ playbook_dir }}/../files/netwatch"

# ── Paths ─────────────────────────────────────────────────────────────────────
netwatch_config_dir: "/etc/netwatch"
netwatch_state_dir: "/var/lib/netwatch"

# ── System user / group ───────────────────────────────────────────────────────
netwatch_user: "netwatch"
netwatch_group: "netwatch"

# ── Network ports ─────────────────────────────────────────────────────────────
netwatch_http_port: 10240    # REST API / health check
netwatch_gossip_port: 7946   # Memberlist gossip (TCP + UDP)

# ── Security ──────────────────────────────────────────────────────────────────
# IMPORTANT: Change this before deploying. Must be identical on ALL nodes.
# Used for first admin setup and JWT signing.
netwatch_setup_token: "CHANGE_ME_strong_secret"

# ── Frontend ──────────────────────────────────────────────────────────────────
# Default (install_from=release): the Nuxt SPA bundle is downloaded from the
# release as netwatch-frontend.tar.gz. netwatch_frontend_src is only used when
# install_from=local (place your own build under ansible/files/frontend/).
netwatch_frontend_dir: "/opt/netwatch-frontend"
netwatch_frontend_src: "{{ playbook_dir }}/../files/frontend/"
netwatch_frontend_port: 80
