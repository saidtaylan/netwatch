# 3-node netwatch cluster booted from the RELEASED artifacts — the most
# prod-faithful test you can run on a single machine. It pulls the published
# ghcr image (NOT a local source build) and the published frontend bundle, so
# what you test is byte-for-byte what ships.
#
#   make staging-up        # pull + boot 3-node cluster + UI, then print members
#   make staging-smoke     # curl-based fault-injection gate (the dependable one)
#   make staging-netem-partition NODE=netwatch-3   # simulate a network partition
#   make staging-netem-clear     NODE=netwatch-3
#   make staging-down      # tear down + wipe volumes
#
# Host ports:  UI :8080 · node-1 API :10240 · node-2 :10241 · node-3 :10242
# Override the version under test with:  VERSION=0.1.7-rc.1 make staging-up
# (VERSION has NO leading "v" — it is the container tag, e.g. 0.1.6. The release
#  asset path is derived as v${VERSION} below, since git tags are v-prefixed.)
x-netwatch: &netwatch
  image: ghcr.io/saidtaylan/netwatch:${VERSION:-0.1.6}
  cap_add: [NET_RAW]            # ICMP ping probes (and lets netem attach later)
  restart: unless-stopped

services:
  # One-shot: make each node's state volume writable by the image's nonroot
  # user (uid 65532) so it can create its SQLite DB + state file.
  state-init:
    image: alpine:latest
    command: sh -c "chown -R 65532:65532 /s1 /s2 /s3"
    volumes:
      - s1:/s1
      - s2:/s2
      - s3:/s3
    restart: "no"

  netwatch-1:
    <<: *netwatch
    container_name: netwatch-1
    hostname: netwatch-1
    depends_on:
      state-init: { condition: service_completed_successfully }
    ports: ["10240:10240"]
    volumes:
      - ./node-1.yaml:/etc/netwatch/config.yaml:ro
      - s1:/var/lib/netwatch

  netwatch-2:
    <<: *netwatch
    container_name: netwatch-2
    hostname: netwatch-2
    depends_on:
      state-init: { condition: service_completed_successfully }
    ports: ["10241:10240"]
    volumes:
      - ./node-2.yaml:/etc/netwatch/config.yaml:ro
      - s2:/var/lib/netwatch

  netwatch-3:
    <<: *netwatch
    container_name: netwatch-3
    hostname: netwatch-3
    depends_on:
      state-init: { condition: service_completed_successfully }
    ports: ["10242:10240"]
    volumes:
      - ./node-3.yaml:/etc/netwatch/config.yaml:ro
      - s3:/var/lib/netwatch

  # One-shot: fetch the published UI bundle for the tag under test.
  ui-init:
    image: alpine:latest
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
      curl -fSL https://github.com/saidtaylan/netwatch/releases/download/v${VERSION:-0.1.6}/netwatch-frontend.tar.gz
      | tar -xz -C /html"
    volumes: [ui-static:/html]
    restart: "no"

  ui:
    image: nginx:alpine
    container_name: netwatch-ui
    depends_on:
      ui-init: { condition: service_completed_successfully }
    ports: ["8080:80"]
    volumes:
      - ui-static:/usr/share/nginx/html:ro
      - ../netwatch-ui.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  s1: {}
  s2: {}
  s3: {}
  ui-static: {}
