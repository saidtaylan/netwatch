# nginx site for the netwatch web UI container (docker-compose).
# Serves the static Nuxt SPA bundle with a single-page-app fallback.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every route returns index.html so the client router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed assets can be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
