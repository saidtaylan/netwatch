# Dev node 1 of 3 — runs as a HOST process (no Docker), built from local source,
# so backend changes show up after `make dev-restart` and frontend changes are
# live via `pnpm dev`. Rich demo dataset (varied targets, a dependency chain,
# apps, SLOs, channels) so the UI is full for screenshots. Shared blocks
# (notifications / slo / targets / apps) are identical across nodes — only
# node_name / bind_port / peers / zone differ.
port: "11240"
node_alias: "dev-netwatch-1"
state_file: "/tmp/netwatch-dev/n1/state.json"
log_path: "/tmp/netwatch-dev/n1/agent.log"
timeout: 5
max_retries: 1
ticker_interval_sec: 2
probe_interval_sec: 15
recovery_probes: 1
reload_interval_sec: 15        # hot-reload config edits without a restart

admin:
  setup_token: "dev-setup-token-change-me-0001"

notifications:
  ops-webhook:
    type: webhook
    parameters:
      url: "https://example.com/hooks/netwatch"
      format: "generic"
  sre-mail:
    type: mail
    parameters:
      smtp_host: "smtp.example.com"
      smtp_port: "587"
      from: "netwatch@example.com"
      to: "sre@example.com"
      tls_mode: "starttls"
  pager:
    type: script
    parameters:
      script: "/tmp/netwatch-dev/alert.sh"
default_notify: ["ops-webhook"]

slo:
  enabled: true
  retention_days: 90
  slo_notify: ["sre-mail"]
  targets:
    # Healthy (up) — for green SLO cards
    - { id: "node-1-api",      target_uptime: 0.999,  window: "7d"  }
    - { id: "node-2-api",      target_uptime: 0.99,   window: "24h" }
    # Breached (the down payments chain + a strict external target)
    - { id: "payments-db",     target_uptime: 0.999,  window: "30d" }
    - { id: "payment-api",     target_uptime: 0.995,  window: "7d"  }
    - { id: "checkout",        target_uptime: 0.999,  window: "7d"  }
    - { id: "company-website", target_uptime: 0.99,   window: "24h" }

targets:
  # Infrastructure — UP
  - { id: "node-1-api",  name: "node-1 API",   type: tcp, target: "127.0.0.1:11240" }
  - { id: "node-2-api",  name: "node-2 API",   type: tcp, target: "127.0.0.1:11241" }
  - { id: "node-3-api",  name: "node-3 API",   type: tcp, target: "127.0.0.1:11242" }
  - { id: "dns-resolver", name: "DNS Resolver", type: tcp, target: "1.1.1.1:53" }
  # Web — UP (external; needs egress)
  - { id: "company-website", name: "Company Website", type: http, target: "https://example.com", options: { expected_status: { in: [200] } } }
  - { id: "public-dns",      name: "Public DNS",      type: dns,  target: "example.com", options: { nameserver: "1.1.1.1:53" } }
  # Payments stack — a DOWN dependency chain (root-cause + cascade demo)
  - { id: "payments-db", name: "Payments DB",      type: tcp, target: "127.0.0.1:5432" }
  - { id: "payment-api", name: "Payment API",      type: tcp, target: "127.0.0.1:8081", depends_on: ["payments-db"] }
  - { id: "checkout",    name: "Checkout Service", type: tcp, target: "127.0.0.1:8082", depends_on: ["payment-api"] }

apps:
  - { name: "Payments",       owner_team: "fintech-sre",  uses: ["payments-db", "payment-api", "checkout"], notifications: ["pager"] }
  - { name: "Web Platform",   owner_team: "platform-eng", uses: ["company-website", "public-dns"] }
  - { name: "Infrastructure", owner_team: "infra-ops",    uses: ["node-1-api", "node-2-api", "node-3-api", "dns-resolver"] }

cluster:
  enabled: true
  node_name: "dev-netwatch-1"
  bind_addr: "127.0.0.1"
  bind_port: 7950
  peers: ["127.0.0.1:7951", "127.0.0.1:7952"]
  expected_node_count: 3
  min_quorum_ratio: 0.5
  probe_replication_factor: 2   # 2 of 3 nodes probe each target → distributed
  zone: "dev-a"
