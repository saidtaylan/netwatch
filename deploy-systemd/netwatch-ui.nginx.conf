# netwatch UI — nginx site serving the pre-built Nuxt SPA as static files.
# No Node.js runtime required. Installed by deploy-systemd/install.sh.
#
# Debian/Ubuntu: /etc/nginx/sites-available/netwatch  (symlinked into sites-enabled)
# RHEL/CentOS:   /etc/nginx/conf.d/netwatch.conf
server {
    listen 80;
    server_name _;

    root /opt/netwatch-ui;
    index index.html;

    # SPA fallback — every route returns index.html so the client-side router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed assets (Nuxt/Vite) can be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
