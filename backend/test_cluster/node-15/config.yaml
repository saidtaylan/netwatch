admin:
  token: test_token
apps:
- name: payment-gateway
  owner_team: fintech-sre
  uses:
  - db-primary
  - api-gateway
  - checkout
cluster:
  bind_port: 50015
  enabled: true
  expected_node_count: 20
  keyring:
  - N9VySoOC7n3BJW3Y2dXeMW5SZM5o0vEtzA4sOkSZ+Ok=
  min_quorum_ratio: 0.5
  node_name: node-15
  peers:
  - 127.0.0.1:50001
  probe_replication_factor: 3
  region: us-east
default_notify:
- webhook-alert
max_retries: 1
notifications:
  webhook-alert:
    parameters:
      url: http://127.0.0.1:9999/webhook
    type: webhook
port: "40015"
probe_interval_sec: 10
recovery_probes: 3
reload_interval_sec: 5
retry_interval_sec: 5
slo:
  enabled: true
  retention_days: 90
  targets:
  - id: db-primary
    target_uptime: 0.99
    window: 24h
state_file: node-15/state.json
targets:
- id: db-primary
  name: Primary Database
  options:
    expected_status:
      in:
      - 200
  target: http://127.0.0.1:9999/db-primary
  type: http
- depends_on:
  - db-primary
  id: api-gateway
  name: API Gateway
  options:
    expected_status:
      in:
      - 200
  target: http://127.0.0.1:9999/api-gateway
  type: http
- depends_on:
  - api-gateway
  id: checkout
  name: Checkout Service
  options:
    expected_status:
      in:
      - 200
  target: http://127.0.0.1:9999/checkout
  type: http
- id: standalone-target
  name: Standalone Target
  options:
    expected_status:
      in:
      - 200
  probe_from:
  - node-10
  - node-11
  target: http://127.0.0.1:9999/standalone-target
  type: http
timeout: 2
