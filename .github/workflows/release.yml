name: Release — build & push container

# Builds a multi-arch (amd64 + arm64) image and pushes it to GitHub Container
# Registry (ghcr.io/<owner>/<repo>). Authentication uses the repository's built-in
# GITHUB_TOKEN — no personal access token or manual `docker login` is required.
#
# Triggers:
#   - pushing a tag like v1.2.3   → publishes :1.2.3, :1.2, :latest
#   - manual run (workflow_dispatch) from the Actions tab → publishes :latest
#
# One-time setup after the first run: open the package at
#   https://github.com/users/<owner>/packages/container/<repo>/settings
# and set its visibility to Public (and link it to this repository).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release + upload binary/frontend assets
  packages: write   # push the container image to GHCR

jobs:
  # ── Prebuilt artifacts (so installs never build from source) ───────────────
  artifacts:
    name: Build binaries + frontend bundle, attach to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build backend binaries (linux amd64 + arm64)
        working-directory: backend
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags="-s -w -X github.com/saidtaylan/netwatch/internal/engine.BinaryName=netwatch" \
              -trimpath -o "dist/netwatch-linux-$arch" ./cmd/linux/
          done

      - uses: pnpm/action-setup@v4
        with:
          version: '11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend static bundle
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          tar -czf ../backend/dist/netwatch-frontend.tar.gz -C .output/public .

      - name: Checksums
        working-directory: backend/dist
        run: sha256sum netwatch-* > SHA256SUMS.txt

      - name: Create/update GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          # Tags containing "-rc" (e.g. v0.1.7-rc.1) are marked as GitHub
          # pre-releases so they never show up as "Latest release".
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            backend/dist/netwatch-linux-amd64
            backend/dist/netwatch-linux-arm64
            backend/dist/netwatch-frontend.tar.gz
            backend/dist/SHA256SUMS.txt

  # ── Container image → GHCR ─────────────────────────────────────────────────
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # A release candidate (v*-rc*) publishes ONLY its exact version tag,
          # e.g. :0.1.7-rc.1. It must not move :latest or :0.1 — those are
          # reserved for promoted stable releases, so production never pulls an
          # untested artifact. The enable= guards implement that.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-rc') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') }}
          labels: |
            org.opencontainers.image.title=netwatch
            org.opencontainers.image.description=Self-hosted distributed network monitoring

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
