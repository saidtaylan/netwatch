name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION:   '1.25'
  # Node 22 is required by current pnpm 11.x (>=11.2 needs Node >=22.13).
  # If you must stay on Node 20, pin PNPM_VERSION to a 10.x release.
  NODE_VERSION: '22'
  PNPM_VERSION: '11'

jobs:
  # ── Backend (Go) ──────────────────────────────────────────────────────────
  backend:
    name: Backend (Go test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./internal/engine/ ./internal/cluster/ ./cmd/linux/

      - name: go build
        run: go build ./internal/engine/ ./internal/cluster/ ./cmd/linux/

      - name: go test -race
        run: go test -race -timeout 300s ./internal/engine/... ./internal/cluster/...

  # ── Frontend (Nuxt 4 — unit) ──────────────────────────────────────────────
  frontend-unit:
    name: Frontend unit (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        run: pnpm build

      - name: pnpm test (unit)
        run: pnpm test

  # ── Frontend (Nuxt 4 — Playwright e2e) ───────────────────────────────────
  frontend-e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    needs: frontend-unit
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── Aggregated gate ───────────────────────────────────────────────────────
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit, frontend-e2e]
    steps:
      - run: echo "All checks passed ✓"
